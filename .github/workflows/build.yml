name: Compilar ScopeLab

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Compila en una Mac Intel de GitHub (las de chip Apple suelen no estar
          # disponibles). El resultado es universal: Apple Silicon + Intel.
          - os: macos-15-intel
            name: ScopeLab-Mac
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Configurar
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          cmake --build build --config Release --parallel 4 2>&1 | tee build.log || {
            # Mostrar los errores como anotaciones para poder leerlos sin abrir el log completo
            grep -E "error( C[0-9]+)?:|error [A-Z]+[0-9]+:" build.log | sort -u | head -n 10 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          }

      - name: Firmar (ad-hoc) en Mac
        if: runner.os == 'macOS'
        run: |
          codesign --force --deep -s - build/ScopeLab_artefacts/Release/VST3/ScopeLab.vst3
          codesign --force --deep -s - build/ScopeLab_artefacts/Release/AU/ScopeLab.component
          codesign --force --deep -s - build/ScopeLab_artefacts/Release/Standalone/ScopeLab.app

      - name: Juntar archivos
        shell: bash
        run: |
          mkdir -p out
          cp -R build/ScopeLab_artefacts/Release/VST3/ScopeLab.vst3 out/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R build/ScopeLab_artefacts/Release/AU/ScopeLab.component out/
            cp -R build/ScopeLab_artefacts/Release/Standalone/ScopeLab.app out/
          else
            cp build/ScopeLab_artefacts/Release/Standalone/ScopeLab.exe out/
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out
